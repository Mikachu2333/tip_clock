[package]
name = "tip_clock"
version = "1.3.1"
edition = "2024"
description = "Tip Clock - Desktop Reminder"
authors = ["Mikachu2333"]
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
chrono = "0.4.45"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
tray-icon = "0.24.1"
single-instance = "0.3.3"
win_msgbox_timeout = "1.2.1"

[build-dependencies]
winresource = "0.1.31"
