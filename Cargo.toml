[package]
name = "tip_clock"
version = "1.3.5"
edition = "2024"
description = "Tip Clock - Desktop Reminder"
authors = ["Mikachu2333"]
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
chrono = "0.4.45"
toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tray-icon = "0.24.2"
single-instance = "0.3.3"
win_msgbox_timeout = "1.2.1"
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "wav",
    "flac",
    "mp3",
] }

[build-dependencies]
winresource = "0.1.31"
